<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  template="/uii/template/template.html"
  xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
  >

    <ui:param name="myPageTitle" value="#{DashboardForm.plugin==null?msgs.startseite:msgs.dashboard}" />
    <ui:define name="breadcrumb">
        <intranda:breadcrumb id="index" label="#{DashboardForm.plugin==null?msgs.startseite:msgs.dashboard}" action="index" navId="a0" noSeparator="#{true}" />
    </ui:define>

    <ui:define name="info">
    </ui:define>

    <ui:define name="content">

    <h:outputScript name="js/dist/scalar.standalone.js?v=#{HelperForm.buildVersion}" />

  		<div id="scalar-container"></div>

        <script>
	        fetch("#{request.contextPath}/api/swagger/openapi.json")
	        .then(res => res.json())
	        .then(json => {
	            Scalar.createApiReference('#scalar-container', {
	                content: json,
	                // the Content-Security-Policy only allows fonts from 'self', so the bundled web fonts cannot be loaded
	                withDefaultFonts: false,
	            });
	        })
        </script>

    </ui:define>
</ui:composition>
