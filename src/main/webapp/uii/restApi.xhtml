<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
    The API reference is a standalone page, opened in its own tab from the administration menu.

    It deliberately loads none of Goobi's stylesheets. Scalar ships its styles inside CSS
    cascade layers, and unlayered rules beat layered ones no matter how specific they are, so
    anything of Goobi's that matched a Scalar element would win - Bootstrap's viewport-relative
    heading sizes and its .lead utility in particular.

    It is served by the Faces servlet like every other .xhtml, so SecurityCheckFilter still
    guards it and still sets the Content-Security-Policy.
-->
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Goobi workflow" />
    <meta name="author" content="intranda GmbH" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="application" content="#{HelperForm.applicationHeaderTitle}" />
    <meta name="version" content="#{HelperForm.version}" />
    <meta name="build date" content="#{HelperForm.buildDate}" />
    <meta name="git-revision" content="#{HelperForm.revision}" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="template/img/favicon.ico" />
    <!-- Apple devices Homescreen icon -->
    <link rel="apple-touch-icon-precomposed" href="template/img/apple-touch-icon.png" />
    <title>#{msgs.apiDescription} - #{HelperForm.applicationHeaderTitle}</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="scalar-container"></div>

    <script src="#{request.contextPath}/resources/js/dist/scalar.standalone.js?v=#{HelperForm.buildVersion}"></script>
    <script>
        fetch("#{request.contextPath}/api/swagger/openapi.json")
            .then(res => res.json())
            .then(json => {
                Scalar.createApiReference('#scalar-container', {
                    content: json,
                    // the Content-Security-Policy only allows fonts from 'self', so the bundled web fonts cannot be loaded
                    withDefaultFonts: false,
                    // Scalar's hosted features default to being on for localhost and the reserved
                    // development domains, which means developers get a page users never see: an
                    // "Ask AI" agent that uploads the OpenAPI document to api.scalar.com, and a
                    // Developer Tools / Configure / Share / Deploy toolbar. Turn both off everywhere.
                    agent: { disabled: true },
                    showDeveloperTools: 'never',
                    telemetry: false,
                });
            });
    </script>
</body>
</html>
