<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	template="/uii/template/template.html"
	xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:jsf="http://xmlns.jcp.org/jsf"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
	xmlns:util="http://goobi.io/util"
	xmlns:editor="http://goobi.io/editor"
	xmlns:section="http://goobi.io/section"
	xmlns:dialog="http://goobi.io/dialog"
	xmlns:form="http://goobi.io/form"
	xmlns:p="http://primefaces.org/ui"
	>

	<ui:param name="myPageTitle"
		value="#{msgs.intranda_administration_ruleset_editor}" />

	<ui:define name="breadcrumb" role="navigation">
		<intranda:breadcrumb id="index"
			label="#{DashboardForm.dashboardAvailable?msgs.dashboard:msgs.startseite}"
			action="index" navId="a0" />
		<intranda:breadcrumb id="ruleset_editor" label="#{myPageTitle}"
			action="ruleset_editor" noSeparator="#{true}" />
	</ui:define>

	<ui:define name="info">
	</ui:define>

	<ui:define name="content">

		<!-- The area for messages that came from the backend -->
		<h:messages for="rulesetEditor" escape="false"
			errorClass="alert alert-danger" infoClass="alert alert-info"
			warnClass="alert alert-warning" showDetail="true" showSummary="true"
			tooltip="true" styleClass="messages" />

		<!-- Without permission -->
		<ui:fragment rendered="#{!LoginForm.hasRole('Admin_ruleset_editor')}">
			<intranda:box boxType="neutral" boxPadding="true" icon="plug"
				title="#{msgs[rulesetEditorBean.title]}">

				<div class="alert alert-danger alert-dismissable">
					<h:outputText
						value="#{msgs.plugin_administration_missingPermission} Admin_ruleset_editor" />
				</div>
			</intranda:box>
		</ui:fragment>

		<!-- With permission -->
		<h:form id="rulesetEditorForm"
			enctype="multipart/form-data"
			rendered="#{LoginForm.hasRole('Admin_ruleset_editor')}">

			<div class="row">
				<div class="col-sm-12 col-md-4 mb-3" id="leftarea">

					<!-- BOX WITH FILES -->
					<intranda:box boxType="primary" boxPadding="false"
						icon="files"
						title="#{msgs.plugin_administration_ruleset_editor_ruleset_selection}">

						<!-- TABLE WITH FILE LIST -->
						<div class="gw-table gw-table-fixed">
							<div class="gw-table__wrapper">
								<h:dataTable id="ruleset_table"
									styleClass="table table-bordered table-fixed table-hover"
									var="item" value="#{rulesetEditorBean.rulesets}">
									<!-- name with the file below -->
									<h:column>
										<f:facet name="header">
											<h:outputText value="#{msgs.regelsatz}" />
										</f:facet>
										<h:outputText value="#{item.titel}" />
										<br />
										<small class="text-muted">
											<h:outputText value="#{item.datei}" />
										</small>
									</h:column>
									<!-- number of processes using the ruleset -->
									<h:column headerClass="gw-table-fixed__sizeXXS text-end">
										<f:facet name="header">
											<h:outputText value="#{msgs.prozesse}" />
										</f:facet>
										<div class="text-end">
											<!-- links to the process list with these processes, the process search has a ruleset filter for this -->
											<h:commandLink
												rendered="#{rulesetEditorBean.getProcessCount(item) > 0}"
												action="#{rulesetEditorBean.showProcessesOfRuleset(item)}"
												title="#{msgs.ruleset_show_processes}"
												pt:aria-label="#{msgs.ruleset_show_processes}">
												<f:setPropertyActionListener target="#{NavigationForm.aktuell}" value="a22" />
												<f:setPropertyActionListener target="#{NavigationForm.parentMenu}" value="menu_workflow" />
												<h:outputText value="#{rulesetEditorBean.getProcessCount(item)}" />
											</h:commandLink>
											<h:outputText
												rendered="#{rulesetEditorBean.getProcessCount(item) == 0}"
												value="0" />
										</div>
									</h:column>
									<h:column headerClass="gw-table-fixed__sizeXXS">
										<f:facet name="header">
											<h:outputText value="#{msgs.auswahl}" />
										</f:facet>
										<div class="gw-table__actions__container">
											<!-- Edit-Ruleset-Button -->
											<h:panelGroup
												rendered="#{rulesetEditorBean.currentRuleset == null}">
												<button
													jsf:id="edit"
													class="btn btn-icon #{rulesetEditorBean.isActiveRuleset(item) ? 'btn-primary' : 'btn-blank'}"
													title="#{rulesetEditorBean.isRulesetWritable(item) ? msgs.regelsatzBearbeiten : msgs.plugin_administration_ruleset_editor_show_ruleset}"
													jsf:rel="tooltip"
													jsf:action="#{rulesetEditorBean.editRuleset(item)}">
													<util:icon icon="#{rulesetEditorBean.isRulesetWritable(item) ? 'pencil' : 'eye'}" />
												</button>
											</h:panelGroup>
											<h:panelGroup
												rendered="#{rulesetEditorBean.currentRuleset != null}">
												<button
													jsf:id="edit2"
													class="btn btn-icon #{rulesetEditorBean.isActiveRuleset(item) ? 'btn-primary' : 'btn-blank'}"
													jsf:action="#{rulesetEditorBean.editRuleset(item)}"
													title="#{rulesetEditorBean.isRulesetWritable(item) ? msgs.regelsatzBearbeiten : msgs.plugin_administration_ruleset_editor_show_ruleset}">
													<util:icon icon="#{rulesetEditorBean.isRulesetWritable(item) ? 'pencil' : 'eye'}" />
												</button>
											</h:panelGroup>
											<!-- Settings-Button: opens the settings dialog, sends only itself so unsaved editor content stays -->
											<button
												jsf:id="settings"
												type="button"
												class="btn btn-icon btn-blank"
												title="#{msgs.regelsatzBearbeiten}"
												aria-label="#{msgs.regelsatzBearbeiten}"
												jsf:rel="tooltip"
												jsf:action="#{rulesetEditorBean.openSettings(item)}">
												<util:icon icon="settings" />
												<f:ajax execute="@this" render=":rulesetEditorForm:settingsDialogWrapper"
													onevent="function(data) { if (data.status === 'success') { document.querySelector('#rulesetSettingsModal').showModal(); } }" />
											</button>
											<!-- Duplicate-Button: copies file and ruleset with "_copy", as in the project and user group lists, without asking because nothing is overwritten -->
											<button
												jsf:id="duplicate"
												class="btn btn-icon btn-blank"
												jsf:action="#{rulesetEditorBean.duplicateRuleset(item)}"
												title="#{msgs.duplicate}"
												aria-label="#{msgs.duplicate}"
												jsf:rel="tooltip">
												<util:icon icon="clipboard" />
											</button>
										</div>
									</h:column>
								</h:dataTable>
							</div>
						</div>
						<!-- // TABLE WITH FILE LIST -->
						<!-- Add-Ruleset-Button: opens the settings dialog empty -->
						<div class="p-3">
							<button
								jsf:id="addRuleset"
								type="button"
								class="btn btn-primary"
								jsf:action="#{rulesetEditorBean.openSettings(null)}">
								<util:icon icon="plus" />
								<span>#{msgs.neuenRegelsatzAnlegen}</span>
								<f:ajax execute="@this" render=":rulesetEditorForm:settingsDialogWrapper"
									onevent="function(data) { if (data.status === 'success') { document.querySelector('#rulesetSettingsModal').showModal(); } }" />
							</button>
							<!-- files in the ruleset folder that no ruleset uses yet -->
							<ui:fragment rendered="#{not empty rulesetEditorBean.unusedRulesetFiles}">
								<div class="text-muted mt-2">
									<h:outputFormat value="#{msgs.ruleset_unused_files}">
										<f:param value="#{rulesetEditorBean.unusedRulesetFiles.size()}" />
									</h:outputFormat>
									<ui:repeat var="fileName" value="#{rulesetEditorBean.unusedRulesetFiles}" varStatus="status">
										<h:outputText value="#{fileName}" />#{status.last ? '' : ', '}
									</ui:repeat>
								</div>
							</ui:fragment>
						</div>
					</intranda:box>
				<!-- // LEFT AREA -->


				<!-- RIGHT AREA -->
				<!-- // BOX WITH FILES -->
				
					<!-- BOX WITH VALIDATION RESULTS -->
					<ui:fragment rendered="#{rulesetEditorBean.currentRuleset != null}">
						<div class="mt-3">
							<section:section
								id="validationSection"
								type="outline"
								collapsible="true"
								collapsed="#{rulesetEditorBean.validationErrors == null}">
								<section:header
									title="#{msgs.plugin_administration_ruleset_editor_validation_result}"
									icon="circle-check" />
								<section:body>
									<!-- last validation and button -->
									<div class="box__actions px-3 align-items-center">
										<h:outputFormat
											styleClass="me-auto"
											value="#{msgs.ruleset_validation_last_run}"
											rendered="#{rulesetEditorBean.lastValidation != null}">
											<f:param value="#{rulesetEditorBean.lastValidation}" />
										</h:outputFormat>
										<h:outputText
											styleClass="me-auto"
											value="#{msgs.ruleset_validation_not_run}"
											rendered="#{rulesetEditorBean.lastValidation == null}" />
										<!-- show or hide INFO messages -->
										<button jsf:id="buttonShowMore"
											class="btn btn-blank"
											jsf:rendered="#{rulesetEditorBean.infoMessagesAvailable}"
											jsf:action="#{rulesetEditorBean.toggleShowMore}">
											<span>#{rulesetEditorBean.showMore ? msgs.ruleset_validation_show_less : msgs.ruleset_validation_show_more}</span>
											<f:ajax render="validationResults buttonShowMore" />
										</button>
										<button jsf:id="validate"
											class="btn btn-primary"
											jsf:action="#{rulesetEditorBean.validate}">
											<util:icon icon="check" />
											<span>#{msgs.validieren}</span>
										</button>
									</div>
									<!-- results -->
									<h:panelGroup
										layout="block"
										id="validationResults"
										styleClass="px-3 pb-3"
										rendered="#{rulesetEditorBean.validationErrors != null}">

									<h:outputText
										rendered="#{rulesetEditorBean.validationErrors.size() == 0}"
										styleClass="alert alert-info"
										value="#{msgs.ruleset_validation_no_issues}" />

									<ui:repeat var="error" value="#{rulesetEditorBean.validationErrors}">

	                                    <h:panelGroup rendered="#{error.severity ne 'INFO' or (error.severity eq 'INFO' and rulesetEditorBean.showMore)}"
	                                        styleClass="alert #{error.severity eq 'WARNING'?'alert-warning':error.severity eq 'INFO'?'alert-secondary':'alert-danger'} d-block">

		                                    <div class="row">
		                                    	 <div class="col-8">
				                                    <h:outputText
				                                        value="#{error.message}"/>
		                                    	 </div>
		                                    	 <div class="col-4">
			                                    	<button
														jsf:id="button_neutral-500"
														class="btn btn-primary float-end"
														type="button"
														data-scroll-to-line="#{error.line}">
														<h:outputText value="#{msgs.ruleset_validation_line}: #{error.line}" />
													</button>
													<div
														class="d-inline"
														data-bs-toggle="tooltip">
														<h:panelGroup layout="block"
    													styleClass="d-inline"
    													rendered="#{error.errorType eq 'DUPLICATES_IN_DOCSTRCT' or  error.errorType eq 'DUPLICATES_IN_GROUP' or error.errorType eq 'VALIDATE_FORMATS' or  error.errorType eq 'INVALID_TOPSTRCT_USAGE' or  error.errorType eq 'UNUSED_BUT_DEFINED' or error.errorType eq 'USED_BUT_UNDEFINED' or error.errorType eq 'INVALID_CARDINALITY'}">
														<button
															title = "#{msgs.additionalOptions}"
															jsf:id="additionalOptionsDropdown"
															aria-label="#{msgs.additionalOptions}"
															aria-haspopup="true"
															aria-expanded="false"
															type="button"
															class="btn btn-neutral-500 dropdown-toggle float-end me-2 d-none"
															data-bs-toggle="dropdown"
															data-developer-tool="true">
															<util:icon icon="square-check"/>
														</button>

														<ul class="dropdown-menu">
														<li>
            												<h:panelGroup rendered="#{error.errorType eq 'INVALID_TOPSTRCT_USAGE'}">
               													<button jsf:id="btn_mets"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 0)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_deleteThisElement_invalidTopStrctUsage}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'DUPLICATES_IN_DOCSTRCT'}">
               													<button jsf:id="btn_mets_1"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 0)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_deleteThisElement_duplicateInDocStrct}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'DUPLICATES_IN_GROUP'}">
               													<button jsf:id="btn_mets_2"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 0)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_deleteThisElement_duplicateInGroup}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'UNUSED_BUT_DEFINED'}">
               													<button jsf:id="btn_mets_3"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 0)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_deleteThisElement_unusedButDefined}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'VALIDATE_FORMATS'}">
               													<button jsf:id="btn_mets_4"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 0)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_deleteThisElement_validateFormats}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'USED_BUT_UNDEFINED'}">
               													<button jsf:id="btn_mets_5"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 0)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_deleteThisElement_usedButUndefined}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'USED_BUT_UNDEFINED' or error.errorType eq 'VALIDATE_FORMATS'}">
               													<button jsf:id="btn_mets_6"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 1)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_defineMetadataType}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'INVALID_CARDINALITY'}">
               													<button jsf:id="btn_mets_7"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 1)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_setCardinalityValue_1o}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'INVALID_CARDINALITY'}">
               													<button jsf:id="btn_mets_8"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 2)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_setCardinalityValue_star}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'INVALID_CARDINALITY'}">
               													<button jsf:id="btn_mets_9"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 3)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_setCardinalityValue_1m}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
       													 <li>
            												<h:panelGroup rendered="#{error.errorType eq 'INVALID_CARDINALITY'}">
               													<button jsf:id="btn_mets_10"
   												                     onclick="preventDoubleSubmit(this);"
     												                 class="dropdown-item"
     												                 jsf:action="#{rulesetEditorBean.handleAction(error, 4)}">
     													             <util:icon icon="circle-check"/>
                   													<span>#{msgs.ruleset_validation_fix_setCardinalityValue_plus}</span>
                												</button>
           													</h:panelGroup>
       													 </li>
														</ul>
														</h:panelGroup>
													</div>
		                                    	 </div>
		                                    </div>

										</h:panelGroup>
	                                </ui:repeat>
									</h:panelGroup>
								</section:body>
							</section:section>
						</div>
					</ui:fragment>
					<!-- // BOX WITH VALIDATION RESULTS -->

					<!-- BOX FOR THE PROCESS CHECK -->
					<ui:fragment rendered="#{rulesetEditorBean.currentRuleset != null}">
						<div class="mt-3">
							<section:section
								id="processCheckSection"
								type="outline"
								collapsible="true"
								collapsed="#{rulesetEditorBean.processCheck == null}">
								<section:header
									title="#{msgs.ruleset_process_check}"
									icon="list-check" />
								<section:body>
									<!-- optional filter, same syntax as in the process list -->
									<div class="px-3 pt-3">
										<div class="input-group">
											<span class="input-group-text">
												<util:icon icon="search" />
											</span>
											<h:inputText
												id="processCheckFilter"
												styleClass="form-control"
												value="#{rulesetEditorBean.processCheckFilter}"
												pt:placeholder="#{msgs.ruleset_process_check_filter}"
												pt:aria-label="#{msgs.ruleset_process_check_filter}" />
										</div>
									</div>
									<!-- number of processes and buttons; start is a full submit so the unsaved editor content is sent along -->
									<h:panelGroup layout="block" id="processCheckActions" styleClass="box__actions px-3 align-items-center">
										<h:outputFormat
											styleClass="me-auto"
											value="#{msgs.ruleset_process_check_count}">
											<f:param value="#{rulesetEditorBean.getProcessCount(rulesetEditorBean.currentRuleset)}" />
										</h:outputFormat>
										<button jsf:id="processCheckCancel"
											class="btn btn-blank"
											jsf:rendered="#{rulesetEditorBean.processCheck.running}"
											jsf:action="#{rulesetEditorBean.cancelProcessCheck}">
											<span>#{msgs.abbrechen}</span>
										</button>
										<button jsf:id="processCheckStart"
											class="btn btn-primary"
											jsf:disabled="#{rulesetEditorBean.processCheck.running}"
											jsf:action="#{rulesetEditorBean.startProcessCheck}">
											<util:icon icon="refresh" />
											<span>#{rulesetEditorBean.processCheck == null ? msgs.ruleset_process_check_start : msgs.ruleset_process_check_again}</span>
										</button>
									</h:panelGroup>
									<!-- result, refreshed every second while the check runs -->
									<h:panelGroup
										layout="block"
										id="processCheckResults"
										styleClass="px-3 pb-3 d-flex flex-column gap-2"
										rendered="#{rulesetEditorBean.processCheck != null}">
										<p:poll
											interval="1"
											update="processCheckResults processCheckActions"
											rendered="#{rulesetEditorBean.processCheck.running}" />
										<h:outputFormat
											styleClass="text-muted"
											value="#{msgs.ruleset_process_check_last_run}">
											<f:param value="#{rulesetEditorBean.lastProcessCheck}" />
										</h:outputFormat>
										<ui:fragment rendered="#{rulesetEditorBean.processCheck.running}">
											<div class="progress" role="progressbar"
												aria-valuenow="#{rulesetEditorBean.processCheck.done}" aria-valuemin="0"
												aria-valuemax="#{rulesetEditorBean.processCheck.total}">
												<div class="progress-bar progress-bar-striped progress-bar-animated"
													style="width: #{rulesetEditorBean.processCheck.total == 0 ? 0 : 100 * rulesetEditorBean.processCheck.done / rulesetEditorBean.processCheck.total}%">
													#{rulesetEditorBean.processCheck.done} / #{rulesetEditorBean.processCheck.total}
												</div>
											</div>
										</ui:fragment>
										<h:outputFormat value="#{msgs.ruleset_process_check_summary}">
											<f:param value="#{rulesetEditorBean.processCheck.done}" />
											<f:param value="#{rulesetEditorBean.processCheck.done - rulesetEditorBean.processCheck.errors.size()}" />
											<f:param value="#{rulesetEditorBean.processCheck.errors.size()}" />
										</h:outputFormat>
										<h:outputText
											rendered="#{rulesetEditorBean.processCheckOutdated}"
											styleClass="alert alert-warning d-block mb-0"
											value="#{msgs.ruleset_process_check_outdated}" />
										<h:outputText
											rendered="#{!rulesetEditorBean.processCheck.running and empty rulesetEditorBean.processCheck.errors}"
											styleClass="alert alert-info d-block mb-0"
											value="#{msgs.ruleset_process_check_no_errors}" />
										<!-- errors as they were found, not grouped -->
										<ui:fragment rendered="#{not empty rulesetEditorBean.processCheck.errors}">
											<div class="gw-table">
												<div class="gw-table__wrapper">
													<h:dataTable
														id="processCheckErrors"
														styleClass="table table-bordered table-hover"
														var="error"
														value="#{rulesetEditorBean.processCheck.errors}">
														<h:column>
															<f:facet name="header">
																<h:outputText value="#{msgs.prozess}" />
															</f:facet>
															<h:outputText value="#{error.title}" />
															<br />
															<small class="text-muted">
																<h:outputText value="#{error.project}" />
															</small>
														</h:column>
														<h:column>
															<f:facet name="header">
																<h:outputText value="#{msgs.fehler}" />
															</f:facet>
															<h:outputText styleClass="text-danger" value="#{error.message}" />
														</h:column>
														<h:column headerClass="gw-table-fixed__sizeXXS">
															<f:facet name="header">
																<h:outputText value="#{msgs.auswahl}" />
															</f:facet>
															<div class="gw-table__actions__container">
																<!-- metadata editor, as in the process list -->
																<h:commandLink
																	styleClass="btn btn-icon btn-blank"
																	rendered="#{error.openable}"
																	action="#{Metadaten.XMLlesen}"
																	title="#{msgs.metadatenBearbeiten}"
																	pt:aria-label="#{msgs.metadatenBearbeiten}"
																	onclick="preventDoubleSubmit(this);">
																	<util:icon icon="book" />
																	<f:param name="ProzesseID" value="#{error.processId}" />
																	<f:param name="BenutzerID" value="#{LoginForm.myBenutzer.id}" />
																	<f:param name="zurueck" value="ruleset_editor" />
																</h:commandLink>
																<!-- process details, when the metadata editor cannot open the process -->
																<button
																	jsf:id="processDetails"
																	class="btn btn-icon btn-blank"
																	jsf:rendered="#{!error.openable and LoginForm.hasRole('Workflow_General_Details')}"
																	jsf:action="#{rulesetEditorBean.showProcessDetails(error.processId)}"
																	title="#{msgs.prozessBearbeiten}"
																	aria-label="#{msgs.prozessBearbeiten}"
																	jsf:rel="tooltip">
																	<f:setPropertyActionListener target="#{NavigationForm.aktuell}" value="a22" />
																	<f:setPropertyActionListener target="#{NavigationForm.parentMenu}" value="menu_workflow" />
																	<util:icon icon="pencil" />
																</button>
															</div>
														</h:column>
													</h:dataTable>
												</div>
											</div>
											<div>
												<button jsf:id="processCheckShowAll"
													class="btn btn-primary"
													jsf:rendered="#{!rulesetEditorBean.processCheck.running}"
													jsf:action="#{rulesetEditorBean.showProcessCheckErrorsInProcessList}">
													<!-- the process list belongs to the workflow menu, like the menu entry "Vorgänge" -->
													<f:setPropertyActionListener target="#{NavigationForm.aktuell}" value="a22" />
													<f:setPropertyActionListener target="#{NavigationForm.parentMenu}" value="menu_workflow" />
													<util:icon icon="list" />
													<h:outputFormat value="#{msgs.ruleset_process_check_show_in_process_list}">
														<f:param value="#{rulesetEditorBean.processCheck.errors.size()}" />
													</h:outputFormat>
												</button>
											</div>
										</ui:fragment>
									</h:panelGroup>
								</section:body>
							</section:section>
						</div>
					</ui:fragment>
					<!-- // BOX FOR THE PROCESS CHECK -->

				</div>
				<div class="col-sm-12 col-md-8" id="rightarea">
					<h:panelGroup
						rendered="#{rulesetEditorBean.currentRuleset != null}">
						<intranda:box id="contentbox" boxType="action" boxPadding="true"
							icon="tool" title="#{rulesetEditorBean.currentEditorTitle}">


							<div id="boxUntilBottom">
								<!-- The message area for saved-successfully-messages -->
								<!-- Buttons on top of text editor -->
								<div class="form-actions mt-0 mb-3">
									<!-- date of the last save -->
									<span class="me-auto align-self-center text-muted">
										<h:outputText value="#{msgs.zuletztBearbeitet}: #{rulesetEditorBean.getLastModifiedDateOfRuleset(rulesetEditorBean.currentRuleset)}" />
									</span>
									<!-- upload a new file, replace the editor content with it, as in the config file editor -->
									<label class="btn btn-blank">
										<h:outputText value="#{msgs.fileUpload}" />
										<h:inputFile
											id="fileupload"
											value="#{rulesetEditorBean.uploadedFile}"
											storage="file"
											style="display:none"
											required="false">
											<f:ajax
												listener="#{rulesetEditorBean.uploadFile}"
												render="@form" />
										</h:inputFile>
									</label>
									<!-- Button to download the current file, or a backup from the menu, as in the config file editor -->
									<div class="btn-group">
										<button
											jsf:id="downloadFile"
											jsf:action="#{rulesetEditorBean.downloadCurrentRulesetFile}"
											class="btn btn-blank"
											title="#{msgs.downloadFile}">
											<span>
												<h:outputText value="#{msgs.downloadFile}" />
											</span>
										</button>
										<ui:fragment rendered="#{rulesetEditorBean.downloadFileAndBackups.size() > 0}">
											<div
												data-bs-toggle="tooltip"
												title="Toggle Dropdown">
												<button
													type="button"
													class="btn btn-blank dropdown-toggle dropdown-toggle-split"
													data-bs-toggle="dropdown"
													aria-expanded="false">
													<span class="visually-hidden">Toggle Dropdown</span>
												</button>
												<ul class="dropdown-menu">
													<ui:repeat
														var="backupFile"
														value="#{rulesetEditorBean.downloadFileAndBackups}">
														<li>
															<button
																jsf:id="downloadBackup"
																jsf:action="#{rulesetEditorBean.downloadBackupFile}"
																class="dropdown-item">
																<h:outputText value="#{backupFile.fileName}" />
																<f:setPropertyActionListener
																	target="#{rulesetEditorBean.selectedFile}"
																	value="#{backupFile}" />
															</button>
														</li>
													</ui:repeat>
												</ul>
											</div>
										</ui:fragment>
									</div>
									<!-- Cancel-Button -->
									<button jsf:id="cancel" class="btn btn-blank float-end"
										jsf:action="#{rulesetEditorBean.cancel}"
										title="#{msgs.cancel}">
										<span>
											<h:outputText value="#{msgs.cancel}" />
										</span>
									</button>
									<!-- Save-Button -->
									<button jsf:id="save" class="btn btn-success float-end"
										jsf:action="#{rulesetEditorBean.save}"
										title="#{msgs.uebernehmen}">
										<util:icon icon="device-floppy" />
										<span>
											#{msgs.save}
										</span>
									</button>
								</div>
								<!-- Text editor -->
								<editor:code>
									<h:inputTextarea
										id="rulesetEditor"
										style="resize: none;"
										pt:aria-label="rulesetEditor"
										forceId="true"
										styleClass="form-control"
										value="#{rulesetEditorBean.currentRulesetFileContent}"
										pt:data-codemirror-target="true"
										pt:data-codemirror-language="xml" />
									<h:inputText
										id="rulesetEditorBase64"
										style="display: none;"
										pt:aria-label="rulesetEditorBase64"
										forceId="true"
										styleClass="form-control"
										value="#{rulesetEditorBean.currentRulesetFileContentBase64}"
										pt:data-codemirror-reference="#{cc.clientId}:rulesetEditor" />
								</editor:code>
							</div>
						</intranda:box>
					</h:panelGroup>
					<!-- Box for non-selected file -->
					<h:panelGroup
						rendered="#{rulesetEditorBean.currentRuleset == null}">

						<intranda:box boxType="outline" boxPadding="false"
							icon="tool" title="#{msgs.noFileSelected}">

							<div style="background-color: #eee; height: 250px;" />
						</intranda:box>

					</h:panelGroup>
				</div>
				<!-- // RIGHT AREA -->

				<!-- MODAL TO ASK FOR SAVING, a plain div so it keeps its id -->
				<ui:fragment rendered="#{rulesetEditorBean.rulesetContentChanged}">
				<div class="modal fade" id="saveDialog" tabindex="-1" role="modal"
					aria-labelledby="myDialogLabel">
					<div class="modal-dialog" role="document">
						<div class="modal-content">

							<!-- MODAL HEADER -->
							<div class="modal-header bg-primary-400 text-white">
								<h4 class="modal-title" id="myDialogLabel">
									<h:outputText
										value="#{msgs.plugin_administration_ruleset_editor_unsaved_changes}" />
								</h4>
								<button type="button" class="btn-close btn-close-white"
									data-bs-dismiss="modal" aria-label="Close"></button>
							</div>
							<!-- // MODAL HEADER -->

							<!-- MODAL BODY -->
							<div class="modal-body">
								<p>#{msgs.plugin_administration_ruleset_editor_save_unsaved_changes}</p>
							</div>
							<!-- // MODAL BODY -->

							<!-- MODAL FOOTER -->
							<div class="modal-footer">
								<button class="btn btn-hot" jsf:id="ignoreChangedFile"
									jsf:action="#{rulesetEditorBean.editRulesetIgnore}">
									<util:icon icon="trash" /> <span> #{msgs.discard} </span>
								</button>
								<button class="btn btn-success" jsf:id="saveWhenChangedFile"
									jsf:action="#{rulesetEditorBean.save}">
									<util:icon icon="device-floppy" /> <span> #{msgs.save} </span>
								</button>
							</div>
							<!-- // MODAL FOOTER -->

						</div>
					</div>
				</div>
				<script>
					// bootstrap adds .modal() to jQuery only after the page has loaded, so open the dialog with the bootstrap API
					bootstrap.Modal.getOrCreateInstance(document.getElementById('saveDialog')).show();
				</script>
				</ui:fragment>
				<!-- // MODAL TO ASK FOR SAVING -->
			</div>

			<!-- SETTINGS DIALOG -->
			<h:panelGroup id="settingsDialogWrapper" layout="block">
				<dialog:modal id="rulesetSettingsModal" width="wide">
					<dialog:header
						icon="settings"
						title="#{rulesetEditorBean.settingsRuleset.id == null ? msgs.neuenRegelsatzAnlegen : msgs.regelsatzBearbeiten}" />
					<ui:fragment rendered="#{rulesetEditorBean.settingsRuleset != null}">
						<dialog:body>
							<h:panelGroup layout="block" styleClass="w-100">
							<form:field label="#{msgs.rulesetTitle}" required="true">
								<h:inputText
									id="settingsTitle"
									styleClass="form-control"
									value="#{rulesetEditorBean.settingsRuleset.titel}" />
							</form:field>
							<form:field label="#{msgs.rulesetFile}" required="true">
								<!-- refreshed after an upload, the rest of the dialog keeps what was typed -->
								<h:panelGroup id="settingsFileField" layout="block" styleClass="w-100">
									<!-- file selection, for a new ruleset with the upload attached to it like other fields with a button; the upload is written to the ruleset folder on save -->
									<div class="input-group">
										<!-- without a free file in the ruleset folder a new ruleset can only bring its own file -->
										<h:selectOneMenu
											id="settingsFile"
											styleClass="form-select"
											rendered="#{not empty rulesetEditorBean.availableRulesetFiles}"
											value="#{rulesetEditorBean.settingsRuleset.datei}">
											<!-- "please select" like other Goobi dropdowns, only shown, never chosen -->
											<f:selectItem
												itemLabel="#{msgs.bitteAuswaehlen}"
												itemValue=""
												noSelectionOption="true"
												itemDisabled="true" />
											<f:selectItems value="#{rulesetEditorBean.availableRulesetFiles}" />
										</h:selectOneMenu>
										<ui:fragment rendered="#{rulesetEditorBean.settingsRuleset.id == null}">
											<label class="btn btn-action text-nowrap">
												<util:icon icon="upload" />
												<h:outputText value="#{msgs.fileUpload}" />
												<h:inputFile
													id="settingsUpload"
													value="#{rulesetEditorBean.settingsUploadedFile}"
													storage="file"
													style="display:none"
													required="false">
													<f:ajax
														listener="#{rulesetEditorBean.uploadSettingsFile}"
														render="settingsFileField" />
												</h:inputFile>
											</label>
										</ui:fragment>
									</div>
									<h:outputText
										styleClass="text-danger d-block mt-1"
										rendered="#{rulesetEditorBean.settingsUploadError != null}"
										value="#{rulesetEditorBean.settingsUploadError}" />
								</h:panelGroup>
							</form:field>
							<form:field label="#{msgs.rulesetOrderByFile}">
								<h:selectBooleanCheckbox
									id="settingsOrder"
									styleClass="form-check-input"
									value="#{rulesetEditorBean.settingsRuleset.orderMetadataByRuleset}" />
							</form:field>
							</h:panelGroup>
						</dialog:body>
						<!-- footer as the usual action bar: buttons right with gaps, delete on the left -->
						<div class="box__actions px-3">
							<!-- delete only rulesets without processes; the wrapper carries the tooltip because a disabled button gets no hover -->
							<ui:fragment rendered="#{rulesetEditorBean.settingsRuleset.id != null}">
								<span
									class="d-inline-block me-auto"
									data-bs-toggle="tooltip"
									title="#{rulesetEditorBean.getProcessCount(rulesetEditorBean.settingsRuleset) > 0 ? msgs.RulesetInUse : ''}">
									<button
										jsf:id="settingsDelete"
										class="btn btn-hot"
										jsf:disabled="#{rulesetEditorBean.getProcessCount(rulesetEditorBean.settingsRuleset) > 0}"
										jsf:action="#{rulesetEditorBean.deleteSettingsRuleset}">
										<util:icon icon="trash" />
										<span>#{msgs.loeschen}</span>
									</button>
								</span>
							</ui:fragment>
							<button
								type="button"
								class="btn btn-blank"
								onclick="this.closest('dialog').close();">
								<span>#{msgs.abbrechen}</span>
							</button>
							<button
								jsf:id="settingsSave"
								class="btn btn-success"
								jsf:action="#{rulesetEditorBean.saveSettings}">
								<util:icon icon="device-floppy" />
								<span>#{msgs.speichern}</span>
							</button>
						</div>
					</ui:fragment>
				</dialog:modal>
			</h:panelGroup>
			<!-- // SETTINGS DIALOG -->
		</h:form>
	</ui:define>
</ui:composition>
