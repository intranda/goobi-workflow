<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:dl="http://goobi.io/dl"
    xmlns:f="http://xmlns.jcp.org/jsf/core"

    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:util="http://goobi.io/util">

    <composite:interface>
    </composite:interface>

    <composite:implementation>

        <!-- BOX WITH PROCESS DETAILS OR WORKFLOW -->
        <h:form id="detailsform">
            <intranda:box
                boxType="outline"
                boxTitle="false"
                boxPadding="false"
                boxForm="false">

                <intranda:boxTitle
                    title="#{currentStep.prozess.titel}"
                    icon="list">

                    <!-- TOGGLE VIEW BUTTON -->
                    <div class="actions d-flex">
                        <button
                            jsf:id="expand"
                            aria-label="#{msgs.expandProcessDetails}"
                            class="btn d-flex align-items-center btn--title-action-neutral"
                            jsf:action="#{NavigationForm.Reload}">
                            <util:icon icon="#{NavigationForm.uiStatus.task_viewWorkflow eq 'full'?'arrows-diagonal-minimize-2':'arrows-diagonal'}" styleClass="icon--lg icon--b4" />
                            <f:setPropertyActionListener
                                target="#{NavigationForm.uiStatus.task_viewWorkflow}"
                                value="#{NavigationForm.uiStatus.task_viewWorkflow eq 'full'?'part':'full'}" />
                            <f:ajax render=":detailsform" />
                        </button>
                    </div>
                    <!-- // TOGGLE VIEW BUTTON -->
                </intranda:boxTitle>

                <!-- DETAILS ONLY -->
                <h:panelGroup rendered="#{NavigationForm.uiStatus.task_viewWorkflow ne 'full'}">
                    <dl:list>
                        <!-- PROCESS -->
                        <dl:term>
                            <h:outputText value="#{msgs.prozess}:" />
                        </dl:term>
                        <dl:description>
                            <h:panelGroup>
                                <h:outputText value="#{currentStep.prozess.titel}" />
                            </h:panelGroup>
                        </dl:description>
                        <!-- // PROCESS -->
                        <!-- STEP TITLE -->
                        <dl:term>
                            <h:outputText value="#{msgs.arbeitsschritt}:" />
                        </dl:term>
                        <dl:description>
                            <h:panelGroup styleClass="icon-text">
                                <util:icon icon="#{currentStep.typAutomatisch ? 'settings-automation' : 'user'}" title="#{currentStep.typAutomatisch ? msgs.automatischerSchritt : msgs.normalerSchritt}" />
                                <span><h:outputText value="#{currentStep.titel}" /></span>
                            </h:panelGroup>
                        </dl:description>
                        <!-- // STEP TITLE -->
                        <!-- PRIORITY -->
                        <dl:term>
                            <h:outputText value="#{msgs.prioritaet}:" />
                        </dl:term>
                        <dl:description>
                            <h:panelGroup>

                                <h:panelGroup rendered="#{currentStep.prioritaet == 0}">
                                    <span class="badge badge-intranda-light"> #{msgs.badgePriority0} </span>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{currentStep.prioritaet == 1}">
                                    <span class="badge badge-intranda-orange"> <util:icon icon="bulb" />
                                        #{msgs.badgePriority1}
                                    </span>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{currentStep.prioritaet == 2}">
                                    <span class="badge badge-intranda-orange"> <util:icon icon="bulb" />
                                        #{msgs.badgePriority2}
                                    </span>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{currentStep.prioritaet gt 2 and currentStep.prioritaet lt 10}">
                                    <span class="badge badge-intranda-orange"> <util:icon icon="bulb" />
                                        #{msgs.badgePriority3}
                                    </span>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{currentStep.prioritaet gt 9}">
                                    <span class="badge badge-intranda-red"> <util:icon icon="speakerphone" />
                                        #{msgs.badgeCorrection}
                                    </span>
                                </h:panelGroup>
                            </h:panelGroup>
                        </dl:description>
                        <!-- // PRIORITY -->
                        <!-- STATUS -->
                        <dl:term>
                            <h:outputText value="#{msgs.status}:" />
                        </dl:term>
                        <dl:description>
                            <h:outputText value="#{currentStep.bearbeitungsstatusEnum.title}" />
                        </dl:description>
                        <!-- // STATUS -->
                        <!-- USER -->
                        <ui:fragment rendered="#{!HelperForm.anonymized}">
                            <dl:term>
                                <h:outputText
                                value="#{msgs.bearbeiter}:" />
                            </dl:term>
                            <dl:description>
                                <h:outputText
                                value="#{currentStep.bearbeitungsbenutzer!=null and currentStep.bearbeitungsbenutzer.id!=0?(currentStep.bearbeitungsbenutzer.vorname).concat(' ').concat(currentStep.bearbeitungsbenutzer.nachname):''}" />
                            </dl:description>
                        </ui:fragment>
                        <!-- // USER -->
                        <!-- EDIT START -->
                        <ui:fragment rendered="#{currentStep.bearbeitungsbeginn !=null and !HelperForm.anonymized}">
                            <dl:term>
                                <h:outputText
                                value="#{msgs.bearbeitungsbeginn}:" />
                            </dl:term>
                            <dl:description>
                                <h:outputText
                                value="#{currentStep.bearbeitungsbeginnAsFormattedString}">
                                <!-- <f:convertDateTime locale="#{SpracheForm.locale}" type="both" dateStyle="medium"/> -->
                            </h:outputText>
                            </dl:description>
                        </ui:fragment>
                        <!-- // EDIT START -->
                        <!-- EDIT END -->
                        <ui:fragment rendered="#{currentStep.bearbeitungszeitpunkt !=null and !HelperForm.anonymized}">
                            <dl:term>
                                <h:outputText
                                value="#{msgs.zuletztBearbeitet}:" />
                            </dl:term>
                            <dl:description>
                                <h:outputText
                                value="#{currentStep.bearbeitungszeitpunktAsFormattedString}">
                                <!-- <f:convertDateTime locale="#{SpracheForm.locale}" type="both" dateStyle="medium"/> -->
                            </h:outputText>
                            </dl:description>
                        </ui:fragment>
                        <!-- // EDIT END -->
                        <!-- PROJECT -->
                        <dl:term>
                            <h:outputText value="#{msgs.projekt}:" />
                        </dl:term>
                        <dl:description>
                            <h:outputText value="#{currentStep.prozess.projekt.titel}" />
                        </dl:description>
                        <!-- // PROJECT -->
                    </dl:list>
                </h:panelGroup>
                <!-- // DETAILS ONLY -->

                <!-- ENTIRE WORKFLOW -->
                <h:panelGroup rendered="#{NavigationForm.uiStatus.task_viewWorkflow eq 'full'}">
                    <table class="table table-hover table-bordered">
                        <thead>
                            <tr>
                                <th scope="col" class="visually-hidden">#{msgs.step}</th>
                                <th scope="col" class="visually-hidden">#{msgs.bearbeiter}</th>
                                <th scope="col" class="visually-hidden">#{msgs.bearbeitungsende}</th>
                            </tr>
                        </thead>
                        <ui:repeat
                            var="step"
                            value="#{currentStep.prozess.schritteList}"
                            id="stepList">
                            <tr>
                                <td colspan="#{(step.bearbeitungsstatusEnum == 'DONE')?'1':'3'}">
                                    <!-- STATUS -->
                                    <div
                                        title="#{step.bearbeitungsstatusEnum.title}"
                                        rel="tooltip"
                                        data-toggle="tooltip"
                                        class="d-inline-block align-middle statusRectangle #{step.bearbeitungsstatusEnum.color}" />
                                    <!-- // STATUS -->

                                    <!-- TYPE + TITLE -->
                                    <span class="icon-text ms-3 align-middle">
                                        <util:icon icon="#{step.typAutomatisch ? 'settings-automation' : 'user'}" styleClass="#{step.bearbeitungsstatusEnum == 'INWORK'?'':'icon--muted'}" title="#{step.typAutomatisch ? msgs.automatischerSchritt : msgs.normalerSchritt}" />
                                        <h:outputText
                                            value="#{step.titel}"
                                            styleClass="#{step.bearbeitungsstatusEnum == 'INWORK'?'':'font-light'}" />
                                    </span>
                                    <!-- TITLE -->

                                    <div
                                        class="row"
                                        jsf:rendered="#{step.bearbeitungsstatusEnum == 'INWORK' and step.id eq currentStep.id}">

                                        <div class="col-4" />

                                        <div class="col-8">

                                            <dl:list>
                                                <dl:term>
                                                    <h:outputText value="#{msgs.prioritaet}:" />
                                                </dl:term>
                                                <dl:description>
                                                    <h:panelGroup>

                                                        <h:panelGroup rendered="#{currentStep.prioritaet == 0}">
                                                            <span class="badge badge-intranda-light">
                                                                #{msgs.badgePriority0} </span>
                                                        </h:panelGroup>

                                                        <h:panelGroup rendered="#{currentStep.prioritaet == 1}">
                                                            <span class="badge badge-intranda-orange"> <util:icon icon="bulb" /> #{msgs.badgePriority1}
                                                            </span>
                                                        </h:panelGroup>

                                                        <h:panelGroup rendered="#{currentStep.prioritaet == 2}">
                                                            <span class="badge badge-intranda-orange"> <util:icon icon="bulb" /> #{msgs.badgePriority2}
                                                            </span>
                                                        </h:panelGroup>

                                                        <h:panelGroup
                                                            rendered="#{currentStep.prioritaet gt 2 and currentStep.prioritaet lt 10}">
                                                            <span class="badge badge-intranda-orange"> <util:icon icon="bulb" /> #{msgs.badgePriority3}
                                                            </span>
                                                        </h:panelGroup>

                                                        <h:panelGroup rendered="#{currentStep.prioritaet gt 9}">
                                                            <span class="badge badge-intranda-red"> <util:icon icon="speakerphone" /> #{msgs.badgeCorrection}
                                                            </span>
                                                        </h:panelGroup>
                                                    </h:panelGroup>
                                                </dl:description>
                                                <dl:term>
                                                    <h:outputText value="#{msgs.status}:" />
                                                </dl:term>
                                                <dl:description>
                                                    <h:outputText value="#{currentStep.bearbeitungsstatusEnum.title}" />
                                                </dl:description>
                                                <ui:fragment rendered="#{!HelperForm.anonymized}">
                                                    <dl:term>
                                                        <h:outputText
                                                        value="#{msgs.bearbeiter}:" />
                                                    </dl:term>
                                                    <dl:description>
                                                        <h:outputText
                                                        value="#{currentStep.bearbeitungsbenutzer!=null and currentStep.bearbeitungsbenutzer.id!=0?(currentStep.bearbeitungsbenutzer.vorname).concat(' ').concat(currentStep.bearbeitungsbenutzer.nachname):''}" />
                                                    </dl:description>
                                                </ui:fragment>
                                                <ui:fragment rendered="#{currentStep.bearbeitungsbeginn !=null and !HelperForm.anonymized}">
                                                    <dl:term>
                                                        <h:outputText
                                                        value="#{msgs.bearbeitungsbeginn}:" />
                                                    </dl:term>
                                                    <dl:description>
                                                        <h:outputText
                                                        value="#{currentStep.bearbeitungsbeginnAsFormattedString}">
                                                        <!-- <f:convertDateTime locale="#{SpracheForm.locale}" type="both" dateStyle="medium"/> -->
                                                    </h:outputText>
                                                    </dl:description>
                                                </ui:fragment>
                                                <ui:fragment rendered="#{currentStep.bearbeitungszeitpunkt !=null and !HelperForm.anonymized}">
                                                    <dl:term>
                                                        <h:outputText
                                                        value="#{msgs.zuletztBearbeitet}:" />
                                                    </dl:term>
                                                    <dl:description>
                                                        <h:outputText
                                                        value="#{currentStep.bearbeitungszeitpunktAsFormattedString}">
                                                        <!-- <f:convertDateTime locale="#{SpracheForm.locale}" type="both" dateStyle="medium"/> -->
                                                    </h:outputText>
                                                    </dl:description>
                                                </ui:fragment>
                                            </dl:list>
                                        </div>

                                    </div>
                                </td>

                                <h:panelGroup
                                    rendered="#{(step.bearbeitungsstatusEnum == 'DONE') and !HelperForm.anonymized}">
                                    <td><h:outputText
                                            styleClass="font-light"
                                            value="#{step.bearbeitungsbenutzer!=null and step.bearbeitungsbenutzer.id!=0?(step.bearbeitungsbenutzer.vorname).concat(' ').concat(step.bearbeitungsbenutzer.nachname):''}" />
                                    </td>
                                    <td><h:outputText
                                            styleClass="font-light"
                                            value="#{step.bearbeitungszeitpunkt !=null?step.bearbeitungszeitpunktAsFormattedString:''}">
                                            <!-- <f:convertDateTime locale="#{SpracheForm.locale}" type="both" dateStyle="medium"/> -->
                                        </h:outputText></td>
                                </h:panelGroup>
                                <h:panelGroup
                                    rendered="#{(step.bearbeitungsstatusEnum == 'DONE') and HelperForm.anonymized}">
                                    <td colspan="2"><h:outputText
                                            styleClass="font-light"
                                            value="#{step.bearbeitungszeitpunkt !=null?step.bearbeitungszeitpunktAsFormattedString:''}">
                                            <!-- <f:convertDateTime locale="#{SpracheForm.locale}" type="both" dateStyle="medium"/> -->
                                        </h:outputText></td>
                                </h:panelGroup>

                            </tr>
                        </ui:repeat>
                    </table>
                </h:panelGroup>
                <!-- // ENTIRE WORKFLOW -->

            </intranda:box>
        </h:form>
        <!-- // BOX WITH PROCESS DETAILS OR WORKFLOW -->


        <!-- JOURNAL -->
        <h:form
            rendered="#{!NavigationForm.uiStatus['journalBig']}"
            styleClass="mt-3"
            id="journal"
            enctype="multipart/form-data"
            prependId="false">
             <intranda:journal showBigButton="true" showFolderSelection="false" showImageComments="false" bean="#{currentStep.prozess}" />
        </h:form>
        <!-- // JOURNAL -->

    </composite:implementation>

</ui:composition>
