<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/uii/template/template.html"
    xmlns:util="http://goobi.io/util"
    xmlns:dl="http://goobi.io/dl"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:param
        name="myPageTitle"
        value="#{DashboardForm.plugin==null?msgs.startseite:msgs.dashboard}" />

    <ui:define name="breadcrumb">
        <intranda:breadcrumb
            id="index"
            label="#{DashboardForm.plugin==null?msgs.startseite:msgs.dashboard}"
            action="index"
            navId="a0"
            noSeparator="#{true}" />
    </ui:define>

    <ui:define name="info">
    </ui:define>

    <ui:define name="content">

        <!-- DASHBOARD PLUGIN -->
        <h:panelGroup rendered="#{DashboardForm.plugin != null}">
            <ui:include src="#{DashboardForm.pluginUi}" />
        </h:panelGroup>
        <!-- // DASHBOARD PLUGIN -->


        <!-- HOME PAGE WITHOUT DASHBOARD -->
        <h:panelGroup
            layout="block"
            class="row"
            rendered="#{DashboardForm.plugin == null}">

            <!-- BIG BOX WITH LOGO -->
            <div class="col-sm-8">
                <intranda:box
                    boxType="primary"
                    boxPadding="true"
                    icon="home"
                    title="#{myPageTitle}">

                    <img
                        src="template/img/goobi/goobi_2.0_logo.png"
                        aria-label="Goobi-logo"
                        style="display: block; margin-top: 60px; margin-bottom: 60px; margin-left: auto; margin-right: auto" />

                    <h:outputText
                        style="text-align: justify;"
                        value="#{HelperForm.applicationHomepageMsg}"
                        escape="false" />
                </intranda:box>
            </div>
            <!-- // BIG BOX WITH LOGO -->

            <!-- SOME STATISTICS -->
            <div class="col-sm-4">
                <intranda:box
                    boxType="action"
                    boxPadding="false"
                    icon="chart-bar"
                    title="#{msgs.statistikDatenbank}">

                    <dl:list>
                        <dl:term>#{msgs.benutzer}:</dl:term>
                        <dl:description>#{StatistikForm.anzahlBenutzer}</dl:description>
                        <dl:term>#{msgs.benutzergruppen}:</dl:term>
                        <dl:description>#{StatistikForm.anzahlBenutzergruppen}</dl:description>
                        <dl:term>#{msgs.prozesse}:</dl:term>
                        <dl:description>#{StatistikForm.anzahlProzesse}</dl:description>
                        <dl:term>#{msgs.schritte}:</dl:term>
                        <dl:description>#{StatistikForm.anzahlSchritte}</dl:description>
                    </dl:list>
                </intranda:box>
            </div>
            <!-- // SOME STATISTICS -->


        </h:panelGroup>
        <!-- // HOME PAGE WITHOUT DASHBOARD -->


    </ui:define>
</ui:composition>
