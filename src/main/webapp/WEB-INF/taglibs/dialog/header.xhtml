<ui:composition
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:section="http://goobi.io/section"
    xmlns:util="http://goobi.io/util"
>
        <section:header icon="#{icon}" title="#{title}">
            <ui:insert />
            <!-- Plain button, not <form method="dialog"> - a <form> nested inside the surrounding h:form is
                 invalid HTML. Browsers ignore the nested <form> start tag but still act on its </form> end
                 tag, which closes the OUTER (real) JSF form early - everything rendered after this point then
                 ends up outside the form in the parsed DOM (no ViewState, ajax requests from it fail with
                 "Form has no view state element"). closest('dialog').close() gets the same native close
                 behavior without introducing a nested form. -->
            <button
                type="button"
                class="btn btn-icon button-modal-close"
                aria-label="#{msgs.abbrechen}"
                onclick="this.closest('dialog').close();"
            >
                <util:icon icon="x" />
            </button>
        </section:header>
</ui:composition>
