<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:metadata="http://goobi.io/metadata"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- Shared body of one metadata group: its own metadata/person/corporate fields, the "add" actions
         (only rendered when editable - i.e. inside the group-edit modal, see group-edit-modal.xhtml) and
         the recursive descent into child groups via metadata:group-box, which keeps propagating the same
         editable flag down the tree.

         Used both by group-box.xhtml (level 0 and level > 0 branches) and directly by group-edit-modal.xhtml
         for the group currently being edited, so this same group can legitimately appear twice in the
         component tree at once (once inline with editable=false, once inside the modal with editable=true) -
         see the idSuffix handling here and in group-box.xhtml. -->
    <c:set var="idSuffix" value="#{editable ? '-modal' : ''}" />

    <div class="#{editable and group.level == 0 ? 'dialog-body--scroll' : ''}">
        <ui:repeat value="#{group.metadataList}" var="metadata" varStatus="status">
            <intranda:formGroupMetadata id="grpMetadata-#{group.metadataGroupId}#{idSuffix}" metadata="#{metadata}" renderDelete="true" renderDuplicate="true"/>
        </ui:repeat>
        <ui:repeat value="#{group.personList}" var="currentPerson">
            <intranda:formGroupPerson id="grpPerson-#{group.metadataGroupId}#{idSuffix}" person="#{currentPerson}" renderDelete="true"/>
        </ui:repeat>
        <ui:repeat value="#{group.corporateList}" var="currentCorporate" varStatus="status">
            <intranda:formGroupCorporate id="grpCorporate-#{group.metadataGroupId}#{idSuffix}" corporate="#{currentCorporate}" renderDelete="true" changeRole="false" index="#{status.index}"/>
        </ui:repeat>

        <ui:fragment rendered="#{group.hasGroups}">
            <c:forEach items="#{group.groupList}" var="childGroup">
                <metadata:group-box group="#{childGroup}" editable="#{editable}"/>
            </c:forEach>
        </ui:fragment>
    </div>

    <c:if test="#{group.level == 0}">
        <h:panelGroup rendered="#{editable}" layout="block" class="p-3 d-flex justify-content-end flex-wrap gap-2">
            <ui:fragment rendered="#{group.metadataAddable or group.corporateAddable or group.personAddable or group.groupAddable}">
                <div class="dropdown" jsf:rendered="#{group.metadataAddable}">
                    <button type="button" class="btn btn-blank addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                        #{msgs.neuesMetadatumAnlegen}
                    </button>
                    <ul class="dropdown-menu">
                        <c:forEach items="#{group.addableMetadata}" var="item" varStatus="status">
                            <li>
                                <button type="button" class="dropdown-item" jsf:id="addMetadatum-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addMetadata}">
                                    #{item.label}
                                    <f:setPropertyActionListener value="#{Metadaten.groupEdit.root}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                    <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                    <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                </button>
                            </li>
                        </c:forEach>
                    </ul>
                </div>
                <div class="dropdown" jsf:rendered="#{group.corporateAddable}">
                    <button type="button" class="btn btn-blank addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                        #{msgs.mets_corporate_createCorporate}
                    </button>
                    <ul class="dropdown-menu">
                        <c:forEach items="#{group.addableCorporations}" var="item" varStatus="status">
                            <li>
                                <button type="button" class="dropdown-item" jsf:id="addCorporate-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addCorporate}">
                                    #{item.label}
                                    <f:setPropertyActionListener value="#{Metadaten.groupEdit.root}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                    <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                    <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                </button>
                            </li>
                        </c:forEach>
                    </ul>
                </div>
                <div class="dropdown" jsf:rendered="#{group.personAddable}">
                    <button type="button" class="btn btn-blank addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                        #{msgs.neuePersonAnlegen}
                    </button>
                    <ul class="dropdown-menu">
                        <c:forEach items="#{group.addablePersons}" var="item" varStatus="status">
                            <li>
                                <button type="button" class="dropdown-item" jsf:id="addPerson-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addPerson}">
                                    #{item.label}
                                    <f:setPropertyActionListener value="#{Metadaten.groupEdit.root}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                    <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                    <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                </button>
                            </li>
                        </c:forEach>
                    </ul>
                </div>
                <div class="dropdown" jsf:rendered="#{group.groupAddable}">
                    <button type="button" class="btn btn-blank addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                        #{msgs.AddNewGroup}
                    </button>
                    <ul class="dropdown-menu">
                        <c:forEach items="#{group.addableGroupTypes}" var="item" varStatus="status">
                            <li>
                                <button type="button" class="dropdown-item" jsf:id="addGroup-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addGroup}">
                                    #{item.label}
                                    <f:setPropertyActionListener value="#{Metadaten.groupEdit.root}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                    <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                    <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                </button>
                            </li>
                        </c:forEach>
                    </ul>
                </div>
            </ui:fragment>
            <button
                type="button"
                class="btn btn-blank"
                aria-label="#{msgs.abbrechen}"
                onclick="this.closest('dialog').close();"
            >
                #{msgs.close}
            </button>
        </h:panelGroup>
    </c:if>
</ui:composition>
