<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:form="http://goobi.io/form"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:metadata="http://goobi.io/metadata"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:util="http://goobi.io/util">

    <c:set var="idSuffix" value="#{editable ? '-modal' : ''}" />

    <c:if test="#{group.level == 0}">
        <div class="box box--#{!editable and group.validationErrorPresent ? 'hot' : 'outline'} section metadata-group-box module__box-level-0">
            <div class="box__title section-header">
                <h2>
                    <util:icon icon="#{!editable and group.validationErrorPresent ? 'alert-triangle' : 'stack-2'}" />
                    #{group.name}
                </h2>
                <div class="actions section-header-actions">
                    <button jsf:id="grpedit-#{group.metadataGroupId}#{idSuffix}" aria-label="#{msgs.bearbeiten}" class="btn" title="#{msgs.bearbeiten}" type="button">
                        <util:icon icon="pencil" styleClass="icon--lg" />
                        <f:setPropertyActionListener value="#{group}" target="#{Metadaten.groupEditTarget}"/>
                        <f:passThroughAttribute name="data-toggle" value="tooltip"/>
                        <f:ajax execute="@this" render=":pageContentCenter" onevent="(data) => { if (data.status === 'success') { meGroupModalOpen(); } }"/>
                    </button>
                    <button jsf:id="grpduplicate-#{group.metadataGroupId}#{idSuffix}" jsf:rendered="#{group.groupDuplicatable}" aria-label="#{msgs.mets_duplicateMetadataGroup}" class="btn" jsf:action="#{Metadaten.CopyGroup}" title="#{msgs.mets_duplicateMetadataGroup}" type="button">
                        <util:icon icon="copy" styleClass="icon--lg" />
                        <f:setPropertyActionListener property="#{Metadaten.currentGroup}" value="#{group}" target="#{Metadaten.currentGroup}"/>
                        <f:passThroughAttribute name="data-toggle" value="tooltip"/>
                        <f:ajax execute="@form" render="@form"/>
                    </button>
                    <button jsf:id="grpdelete-#{group.metadataGroupId}#{idSuffix}" jsf:rendered="#{group.groupDeletable}" aria-label="#{msgs.mets_deleteMetadataGroup}" class="btn" jsf:action="#{Metadaten.deleteGroup}" title="#{msgs.mets_deleteMetadataGroup}" type="button">
                        <util:icon icon="trash" styleClass="icon--lg" />
                        <f:setPropertyActionListener property="#{Metadaten.currentGroup}" value="#{group}" target="#{Metadaten.currentGroup}"/>
                        <f:passThroughAttribute name="data-toggle" value="tooltip"/>
                        <f:ajax execute="@form" render="@form"/>
                    </button>
                </div>
            </div>
            <div class="section-body">
                <metadata:group-fields group="#{group}" editable="#{editable}"/>
            </div>
        </div>
    </c:if>

    <c:if test="#{group.level > 0}">
        <fieldset class="field-set metadata-group-box #{group.level > 1 ? 'metadata-group-box--nested' : ''} module__box-level-#{group.level}">
            <form:legend>
                #{group.name}
                <span class="d-inline-flex flex-wrap justify-content-end">
                    <span class="d-inline-flex flex-wrap justify-content-end">
                        <button jsf:id="grpduplicateNested-#{group.metadataGroupId}#{idSuffix}" jsf:rendered="#{group.groupDuplicatable}" aria-label="#{msgs.mets_duplicateMetadataGroup}" class="btn font-light" jsf:action="#{Metadaten.CopyGroup}" title="#{msgs.mets_duplicateMetadataGroup}" type="button">
                            <util:icon icon="copy" styleClass="icon--lg" />
                            <f:setPropertyActionListener property="#{Metadaten.currentGroup}" value="#{group}" target="#{Metadaten.currentGroup}"/>
                            <f:passThroughAttribute name="data-toggle" value="tooltip"/>
                            <f:ajax execute="@form" render="#{editable ? '@form:@id(groupEditModalBody)' : '@form'}"/>
                        </button>
                        <button jsf:id="grpdeleteNested-#{group.metadataGroupId}#{idSuffix}" jsf:rendered="#{group.groupDeletable}" aria-label="#{msgs.mets_deleteMetadataGroup}" class="btn font-light" jsf:action="#{Metadaten.deleteGroup}" title="#{msgs.mets_deleteMetadataGroup}" type="button">
                            <util:icon icon="trash" styleClass="icon--lg" />
                            <f:setPropertyActionListener property="#{Metadaten.currentGroup}" value="#{group}" target="#{Metadaten.currentGroup}"/>
                            <f:passThroughAttribute name="data-toggle" value="tooltip"/>
                            <f:ajax execute="@form" render="#{editable ? '@form:@id(groupEditModalBody)' : '@form'}"/>
                        </button>
                    </span>
                    <span class="d-inline-flex flex-wrap justify-content-end">
                        <ui:fragment rendered="#{editable and (group.metadataAddable or group.corporateAddable or group.personAddable or group.groupAddable)}">
                            <div class="dropdown" jsf:rendered="#{group.metadataAddable}">
                                <button type="button" class="btn font-light addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                                    <util:icon icon="plus" />
                                </button>
                                <ul class="dropdown-menu">
                                    <c:forEach items="#{group.addableMetadata}" var="item" varStatus="status">
                                        <li>
                                            <button type="button" class="dropdown-item" jsf:id="addMetadatum-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addMetadata}">
                                                #{item.label}
                                                <f:setPropertyActionListener value="#{group}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                                <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                                <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                            </button>
                                        </li>
                                    </c:forEach>
                                </ul>
                            </div>
                            <div class="dropdown" jsf:rendered="#{group.corporateAddable}">
                                <button type="button" class="btn font-light addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                                    <util:icon icon="home-plus" />
                                </button>
                                <ul class="dropdown-menu">
                                    <c:forEach items="#{group.addableCorporations}" var="item" varStatus="status">
                                        <li>
                                            <button type="button" class="dropdown-item" jsf:id="addCorporate-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addCorporate}">
                                                #{item.label}
                                                <f:setPropertyActionListener value="#{group}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                                <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                                <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                            </button>
                                        </li>
                                    </c:forEach>
                                </ul>
                            </div>
                            <div class="dropdown" jsf:rendered="#{group.personAddable}">
                                <button type="button" class="btn font-light addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                                    <util:icon icon="user-plus" />
                                </button>
                                <ul class="dropdown-menu">
                                    <c:forEach items="#{group.addablePersons}" var="item" varStatus="status">
                                        <li>
                                            <button type="button" class="dropdown-item" jsf:id="addPerson-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addPerson}">
                                                #{item.label}
                                                <f:setPropertyActionListener value="#{group}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                                <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                                <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                            </button>
                                        </li>
                                    </c:forEach>
                                </ul>
                            </div>
                            <div class="dropdown" jsf:rendered="#{group.groupAddable}">
                                <button type="button" class="btn font-light addable dropdown-toggle" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-haspopup="true" aria-expanded="false">
                                    <util:icon icon="library-plus" />
                                </button>
                                <ul class="dropdown-menu">
                                    <c:forEach items="#{group.addableGroupTypes}" var="item" varStatus="status">
                                        <li>
                                            <button type="button" class="dropdown-item" jsf:id="addGroup-#{group.metadataGroupId}#{idSuffix}-#{status.index}" jsf:action="#{Metadaten.groupEdit.addGroup}">
                                                #{item.label}
                                                <f:setPropertyActionListener value="#{group}" target="#{Metadaten.groupEdit.actionTarget}"/>
                                                <f:setPropertyActionListener value="#{item.value}" target="#{Metadaten.groupEdit.actionTypeName}"/>
                                                <f:ajax execute="@this" render="@form:@id(groupEditModalBody)"/>
                                            </button>
                                        </li>
                                    </c:forEach>
                                </ul>
                            </div>
                        </ui:fragment>
                    </span>
                </span>
            </form:legend>
            <form:fieldset-content>
                <metadata:group-fields group="#{group}" editable="#{editable}"/>
            </form:fieldset-content>
        </fieldset>
    </c:if>
</ui:composition>
