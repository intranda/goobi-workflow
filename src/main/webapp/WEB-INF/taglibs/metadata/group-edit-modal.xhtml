<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:dialog="http://goobi.io/dialog"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:form="http://goobi.io/form"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:metadata="http://goobi.io/metadata"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- Single, page-wide modal used to both add a new metadata group (Metadaten.modeAddGroup) and edit an
         existing one (Metadaten.currentGroup, recursively including its subgroups - see group-fields.xhtml
         with editable=true). Triggered from the "Edit" button on a top-level group (group-box.xhtml), from
         the "Add new group" button (inc_me_metadata-existingMetadataGroup.xhtml) and, while already open,
         from the "add subgroup" action inside the modal itself (group-fields.xhtml).

         Because most actions inside this modal reuse the existing bean actions/ajax wiring (which render
         :pageContentCenter or @form), the native <dialog> element gets torn down and rebuilt on every such
         action, losing its open state. meGroupModalOpen()/meGroupModalStopReopen() below plus the global
         jsf.ajax.addOnEvent listener re-open it right after, so the modal appears to just update in place. -->
    <dialog:modal id="meGroupEditModal">
        <dialog:header icon="stack-2" title="#{Metadaten.modeAddGroup ? msgs.AddNewGroup : (Metadaten.currentGroup != null ? Metadaten.currentGroup.name : msgs.AddNewGroup)}" />
        <dialog:body>
            <h:panelGroup layout="block" styleClass="w-100" id="groupEditModalBody">

                <!-- CREATE: choose a group type, then fill in its initial fields -->
                <ui:fragment rendered="#{Metadaten.modeAddGroup}">
                    <div class="form-row">
                        <div class="form-label">
                            <label>#{msgs.group}:</label>
                        </div>
                        <div class="form-input">
                            <h:selectOneMenu
                                id="groups"
                                styleClass="form-select"
                                value="#{Metadaten.tempMetadataGroupType}">
                                <f:selectItems value="#{Metadaten.addableMetadataGroupTypes}" />
                                <f:ajax
                                    execute="@form"
                                    event="valueChange"
                                    render=":groupEditModalBody" />
                            </h:selectOneMenu>
                            <h:message
                                for="groups"
                                style="color: red" />
                        </div>
                    </div>
                    <ui:repeat
                        var="metadata"
                        value="#{Metadaten.selectedGroup.metadataList}"
                        varStatus="status"
                        id="metadataListRepeat">
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{metadata.typ}:</label>
                                </div>
                                <div class="form-input">
                                    <h:panelGroup
                                        rendered="#{(metadata.outputType == 'textarea')}" >
                                        <form:grow-wrap>
                                            <h:inputTextarea
                                                id="textarea"
                                                styleClass="form-control"
                                                value="#{metadata.value}"
                                                immediate="true"
                                                disabled="#{metadata.disableMetadataField}"
                                                readonly="#{Metadaten.nurLesenModus}" />
                                        </form:grow-wrap>
                                    </h:panelGroup>
                                    <h:inputText
                                        id="text"
                                        styleClass="form-control"
                                        value="#{metadata.value}"
                                        disabled="#{metadata.disableMetadataField}"
                                        readonly="#{Metadaten.nurLesenModus}"
                                        rendered="#{metadata.outputType == 'input'}" />
                                    <h:selectManyListbox
                                        id="selectMany"
                                        styleClass="form-control"
                                        value="#{metadata.selectedItems}"
                                        disabled="#{metadata.disableMetadataField}"
                                        rendered="#{metadata.outputType == 'select'}"
                                        readonly="#{Metadaten.nurLesenModus}">
                                        <f:selectItems
                                            value="#{metadata.items}"
                                            itemValue="#{element.label}"
                                            var="element"
                                            itemLabel="#{element.label}" />
                                    </h:selectManyListbox>
                                    <ui:fragment rendered="#{(Metadaten.outputType == 'select1' or
                                        Metadaten.outputType == 'vocabularyList')}">
                                        <div class="form-control form-control--select">
                                            <h:selectOneMenu
                                                id="selectOne"
                                                styleClass="focusable"
                                                disabled="#{metadata.disableMetadataField}"
                                                value="#{metadata.selectedItem}"
                                                readonly="#{Metadaten.nurLesenModus}">
                                                <f:selectItems
                                                    value="#{metadata.items}"
                                                    itemValue="#{element.label}"
                                                    var="element"
                                                    itemLabel="#{element.label}" />
                                            </h:selectOneMenu>
                                        </div>
                                    </ui:fragment>
                                    <h:outputText
                                        value="#{metadata.value}"
                                        rendered="#{(metadata.outputType == 'readonly')}" />
                                </div>
                            </div>
                        </div>
                    </ui:repeat>
                    <ui:repeat
                        var="person"
                        value="#{Metadaten.selectedGroup.personList}"
                        varStatus="status"
                        id="personListRepeat">
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{msgs.vorname}:</label>
                                </div>
                                <div class="form-input">
                                    <h:inputText
                                        id="vornameGroup"
                                        styleClass="form-control"
                                        value="#{person.vorname}" />
                                    <h:message
                                        for="vornameGroup"
                                        style="color: red" />
                                </div>
                            </div>
                        </div>
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{msgs.nachname}:</label>
                                </div>
                                <div class="form-input">
                                    <h:inputText
                                        id="nachnameGroup"
                                        styleClass="form-control"
                                        value="#{person.nachname}" />
                                    <h:message
                                        for="nachnameGroup"
                                        style="color: red" />
                                </div>
                            </div>
                        </div>
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{msgs.rolle}:</label>
                                </div>
                                <div class="form-input">
                                    <h:outputText
                                        id="RolleGroup"
                                        styleClass="form-control"
                                        value="#{person.rolle}" />
                                </div>
                            </div>
                        </div>
                    </ui:repeat>
                    <ui:repeat
                        var="corp"
                        value="#{Metadaten.selectedGroup.corporateList}"
                        varStatus="status"
                        id="corporateListRepeat">
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{msgs.mets_corporate_mainName}:</label>
                                </div>
                                <div class="form-input">
                                    <h:inputText
                                        id="mainNameGrp"
                                        pt:aria-label="#{msgs.mets_corporate_mainName}"
                                        styleClass="form-control"
                                        value="#{corp.mainName}" />
                                    <h:message
                                        for="mainNameGrp"
                                        style="color: red" />
                                </div>
                            </div>
                        </div>
                        <ui:repeat
                            var="part"
                            value="#{corp.subNames}">
                            <div class="form-group form-group--flex">
                                <div class="form-row">
                                    <div class="form-label">
                                        <label>#{msgs.mets_corporate_subName}:</label>
                                    </div>
                                    <div class="form-input">
                                        <h:inputText
                                            id="subNameGrp"
                                            pt:aria-label="#{msgs.mets_corporate_subName}"
                                            styleClass="form-control"
                                            value="#{part.value}" />
                                        <h:message
                                            for="subNameGrp"
                                            style="color: red" />
                                    </div>
                                </div>
                            </div>
                        </ui:repeat>
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{msgs.mets_corporate_partName}:</label>
                                </div>
                                <div class="form-input">
                                    <h:inputText
                                        id="partNameGrp"
                                        pt:aria-label="#{msgs.mets_corporate_partName}"
                                        styleClass="form-control"
                                        value="#{corp.partName}" />
                                    <h:message
                                        for="partNameGrp"
                                        style="color: red" />
                                </div>
                            </div>
                        </div>
                        <div class="form-group form-group--flex">
                            <div class="form-row">
                                <div class="form-label">
                                    <label>#{msgs.rolle}:</label>
                                </div>
                                <div class="form-input">
                                    <h:outputText
                                        id="RolleGroup"
                                        styleClass="form-control"
                                        value="#{corp.role}" />
                                </div>
                            </div>
                        </div>
                    </ui:repeat>
                </ui:fragment>

                <!-- EDIT: the group itself, plus - dynamically - its subgroups and their fields -->
                <ui:fragment rendered="#{!Metadaten.modeAddGroup and Metadaten.currentGroup != null}">
                    <metadata:group-fields group="#{Metadaten.currentGroup}" editable="true" />
                </ui:fragment>
            </h:panelGroup>
        </dialog:body>
        <ui:fragment rendered="#{Metadaten.modeAddGroup}">
            <dialog:footer>
                <div class="p-3 d-flex justify-content-end gap-2 w-100">
                    <button
                        jsf:id="cancelGroup"
                        class="btn btn-blank"
                        jsf:action="#{Metadaten.Abbrechen}"
                        jsf:immediate="true"
                        onclick="meGroupModalStopReopen();"
                        type="button">
                        #{msgs.abbrechen}
                        <f:ajax render=":pageContentCenter" />
                    </button>
                    <h:commandButton
                        id="saveGroup"
                        styleClass="btn btn-neutral-600"
                        type="submit"
                        action="#{Metadaten.saveGroup}"
                        value="#{msgs.add}"
                        onclick="meGroupModalStopReopen();"
                        role="button">
                    </h:commandButton>
                </div>
            </dialog:footer>
        </ui:fragment>
    </dialog:modal>

    <!-- Actions that only affect this modal's own content (currently: the create-mode type selector above)
         render just :groupEditModalBody rather than :pageContentCenter/@form, so the inline group list behind
         the modal doesn't get needlessly re-rendered - and its scroll position reset - while the dialog is open
         (see the form's data-save-scroll-position behavior). Actions that change something the dialog:header
         title depends on (modeAddGroup, currentGroup - e.g. "add subgroup") still render the wider target so
         the title stays in sync; likewise Hinzufuegen/AddCorporate/HinzufuegenPerson, which navigate to the
         separate page-level add-metadata/-person/-corporate forms outside this modal entirely.

         Narrower renders mean the inline list can go stale while the modal is open; this hidden button is
         clicked once, from the dialog's native "close" event (see script below), to bring it back in sync. -->
    <button jsf:id="meGroupModalCloseSync" type="button" style="display:none" aria-hidden="true" tabindex="-1">
        <f:ajax execute="@none" render=":metadataGroupSection" />
    </button>

    <script>
        //<![CDATA[
        (function () {
            window.meGroupModalShouldStayOpen = window.meGroupModalShouldStayOpen || false;

            window.meGroupModalOpen = function () {
                window.meGroupModalShouldStayOpen = true;
                var dialogEl = document.getElementById('meGroupEditModal');
                if (dialogEl && !dialogEl.open) {
                    dialogEl.showModal();
                }
            };

            window.meGroupModalStopReopen = function () {
                window.meGroupModalShouldStayOpen = false;
            };

            if (window.__meGroupModalListenerRegistered) {
                return;
            }
            window.__meGroupModalListenerRegistered = true;

            document.addEventListener('close', function (event) {
                if (event.target && event.target.id === 'meGroupEditModal') {
                    window.meGroupModalShouldStayOpen = false;
                    var syncBtn = document.getElementById('meGroupModalCloseSync');
                    if (syncBtn) {
                        syncBtn.click();
                    }
                }
            }, true);

            // Jakarta Faces 4 renamed the client-side namespace from "jsf" to "faces"; some setups keep
            // "jsf" as a compatibility alias and some don't, so check both instead of assuming either.
            var facesImpl = window.faces || window.jsf;
            if (facesImpl) {
                facesImpl.ajax.addOnEvent(function (data) {
                    if (data.status === 'success' && window.meGroupModalShouldStayOpen) {
                        var dialogEl = document.getElementById('meGroupEditModal');
                        if (dialogEl && !dialogEl.open) {
                            dialogEl.showModal();
                        }
                    }
                });
            }
        })();
        //]]>
    </script>
</ui:composition>
