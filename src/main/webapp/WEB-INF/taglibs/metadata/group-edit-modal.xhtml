<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:dialog="http://goobi.io/dialog"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:metadata="http://goobi.io/metadata"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:form="http://goobi.io/form">

    <dialog:modal id="meGroupEditModal" width="wide">
        <dialog:header icon="stack-2" title="#{Metadaten.groupEdit != null and Metadaten.groupEdit.root != null ? Metadaten.groupEdit.title : msgs.AddNewGroup}" />
        <dialog:body>
            <h:panelGroup layout="block" styleClass="w-100" id="groupEditModalBody">
                <ui:fragment rendered="#{Metadaten.groupEdit != null and Metadaten.groupEdit.root != null}">
                    <metadata:group-fields group="#{Metadaten.groupEdit.root}" editable="true" />
                </ui:fragment>
                <ui:fragment rendered="#{Metadaten.groupEdit != null and Metadaten.groupEdit.root == null}">
                    <form:field label="#{msgs.AddNewGroup}">
                        <h:selectOneMenu id="addTopLevelGroupSelect" value="#{Metadaten.tempAddTypeName}" styleClass="form-select" style="width: 100%">
                            <f:selectItem itemLabel="#{msgs.bitteAuswaehlen}" itemValue=""/>
                            <c:forEach items="#{Metadaten.addableTopLevelGroupTypes}" var="item" varStatus="status">
                                <f:selectItem itemLabel="#{item.label}" itemValue="#{item.value}"/>
                            </c:forEach>
                            <f:ajax event="valueChange" listener="#{Metadaten.onTopLevelGroupTypeSelected}" execute="@this" render=":pageContentCenter" onevent="(data) => { if (data.status === 'success') { meGroupModalOpen(); } }"/>
                        </h:selectOneMenu>
                    </form:field>
                </ui:fragment>
            </h:panelGroup>
        </dialog:body>
    </dialog:modal>

    <button jsf:id="meGroupModalCloseSync" jsf:action="#{Metadaten.closeGroupEdit}" type="button" style="display:none" aria-hidden="true" tabindex="-1">
        <f:ajax execute="@this" render=":metadataGroupSection:metadataGroupSection" />
    </button>
</ui:composition>
